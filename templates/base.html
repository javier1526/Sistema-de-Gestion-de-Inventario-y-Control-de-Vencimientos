{% load static %}
<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Bodega{% endblock %} | Gestión de inventario</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/5.3.8/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="saltar-contenido visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 py-3">
      <span class="marca">Bodega <span>Inventario y vencimientos</span></span>
      {% if user.is_authenticated %}
        <nav class="d-flex flex-wrap align-items-center gap-2" aria-label="Navegación principal">
          <a class="btn btn-link" href="{% url 'usuarios:inicio' %}">Inicio</a>
          <form class="m-0" method="post" action="{% url 'usuarios:cerrar_sesion' %}">
            {% csrf_token %}
            <button class="btn btn-outline-primary" type="submit">Cerrar sesión</button>
          </form>
        </nav>
      {% endif %}
    </div>
  </header>
  <main id="contenido" class="container flex-grow-1 py-4 py-md-5" tabindex="-1">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="container py-3 text-body-secondary small">Sistema de Gestión de Inventario y Control de Vencimientos</footer>
</body>
</html>
