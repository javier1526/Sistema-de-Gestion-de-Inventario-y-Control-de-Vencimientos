{% extends 'base.html' %}
{% block titulo %}Consulta de inventario{% endblock %}
{% block contenido %}
<section class="card acceso mx-auto shadow-sm" aria-labelledby="titulo-error-consulta">
  <div class="card-body p-3 p-sm-4 p-lg-5">
    <h1 id="titulo-error-consulta" class="mb-3">Consulta de inventario</h1>
    <p role="status">{{ mensaje }}</p>
    <a class="btn btn-outline-primary"
       href="{% url 'consulta_inventario:buscar' %}{% if termino %}?q={{ termino|urlencode }}{% endif %}">Volver a la búsqueda</a>
  </div>
</section>
{% endblock %}
